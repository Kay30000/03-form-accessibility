<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Mystery Dining Reservations</title>
  <!-- Google Fonts  -->
  <link
    href="https://fonts.googleapis.com/css2?family=Brandon+Text:wght@400;700&display=swap"
    rel="stylesheet"
  />
  <!-- Link to Bootstrap -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
 
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <header>
    <div class="container header-container">
      <div class="logo">🔎 Mystery Dining</div>
      <nav>
        <ul>
          <li><a href="#">Home</a></li>
          <li><a href="#">About</a></li>
          <li><a href="#">Reservations</a></li>
          <li><a href="#">Contact</a></li>
        </ul>
      </nav>
    </div>
  </header>

  <section class="hero">
    <div class="hero-content">
      <h1>Experience the Unknown</h1>
      <p>
        Reserve your seat and embark on a surprise culinary adventure.
      </p>
      <div class="reservation-card">
        <h2 id="reserve-heading">Reserve Now</h2>
        <div class="form-placeholder">
          <form aria-labelledby="reserve-heading">
            <div class="mb-3">
              <label for="name" class="visually-hidden">Full name</label>
              <input id="name" name="name" type="text" class="form-control" placeholder="Name" autocomplete="name" required autofocus>
            </div>
            <div class="mb-3">
              <label for="email" class="visually-hidden">Email address</label>
              <input id="email" name="email" type="email" class="form-control" placeholder="Email" autocomplete="email" required>
            </div>
            <div class="mb-3">
              <label for="zip" class="visually-hidden">ZIP / Postal code</label>
              <input id="zip" name="postalcode" type="text" class="form-control" placeholder="Zip" autocomplete="postal-code">
            </div>
            <div class="mb-3">
              <label for="party" class="visually-hidden">Party size</label>
              <input id="party" name="party" type="number" class="form-control" placeholder="Party Size" min="1" max="20" value="2" required aria-describedby="party-help">
              <div id="party-help" class="form-text">Enter number of guests (1–20).</div>
            </div>
            <div class="mb-3">
              <label for="spice" class="visually-hidden">Spice preference</label>
              <select id="spice" name="spice" class="form-select" aria-label="Spice preference" required>
                <option value="" disabled selected>Choose...</option>
                <option value="mild">Mild</option>
                <option value="med">Medium</option>
                <option value="spicy">Spicy</option>
              </select>
            </div>
            <fieldset class="mb-3">
              <legend class="visually-hidden">Additional options</legend>
              <div class="form-check">
                <input class="form-check-input" type="checkbox" id="birthday" name="birthday" value="yes">
                <label class="form-check-label" for="birthday">Would you like to pretend it's your birthday for free cake?</label>
              </div>
              <div class="form-check mt-2">
                <input class="form-check-input" type="checkbox" id="accept" name="accept" required>
                <label class="form-check-label" for="accept">I accept that I have no idea where I'll dine, and that's OK.</label>
              </div>
            </fieldset>
            <button type="submit" class="btn btn-lg btn-primary">Book My Mystery Meal!</button>
          </form>
        </div>
      </div>
    </div>
  </section>

  <footer>
    <div class="container">
      <p>&copy; 2025 Mystery Dining. All rights reserved.</p>
    </div>
  </footer>
</body>
</html>
